<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>샵사이다 초대코드 | CIDER 추천인 코드</title>
  <meta name="description" content="샵사이다(CIDER) 초대코드 입력하고 할인 혜택 받으세요. 추천인 코드 복사 후 간편하게 가입 가능합니다.">

  <meta name="google-site-verification" content="BtBII3918J1J9BnNiNfjVaPn0QXfIj5xoi1G_8qtFk4" />
  <meta name="naver-site-verification" content="f28f86b7853e4f6704297b86d7def790b41e00e4" />

  <link rel="canonical" href="https://cider-invite-code-korea.vercel.app/" />

  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Quicksand', sans-serif;
      background: #fff5f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 420px;
      width: 90%;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .code-box {
      display: flex;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #eee;
      margin-bottom: 15px;
    }

    input {
      border: none;
      padding: 14px;
      flex: 1;
      font-size: 14px;
      text-align: center;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .copy {
      background: #ff5c8a;
      color: white;
      border: none;
      padding: 14px 18px;
      cursor: pointer;
      font-weight: 600;
    }

    .cta {
      display: block;
      margin-top: 15px;
      padding: 14px;
      background: #111;
      color: white;
      border-radius: 22px;
      text-decoration: none;
      font-weight: 600;
    }

    .cta:hover {
      background: #333;
    }

    .note {
      font-size: 12px;
      margin-top: 15px;
      color: #aaa;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>샵사이다 초대코드</h1>
  <p>아래 추천인 코드를 복사하고 할인 혜택을 받아보세요.</p>

  <div class="code-box">
    <input type="text" value="IKZFBD1Z4TPRC" id="code" readonly>
    <button class="copy" onclick="copyCode()">복사</button>
  </div>

  <a href="https://www.shopcider.com/" target="_blank" class="cta">
    쇼핑 바로가기
  </a>

  <div class="note">
    비공식 안내 페이지이며, 편의를 위해 제작되었습니다.
  </div>
</div>

<script>
function copyCode() {
  const copyText = document.getElementById("code");
  copyText.select();
  copyText.setSelectionRange(0, 99999);
  document.execCommand("copy");
  alert("코드가 복사되었습니다!");
}
</script>

</body>
</html>
