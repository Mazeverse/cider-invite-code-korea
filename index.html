<!DOCTYPE html>

  <style>

    body {

      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .wrap {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: #ffffff;
      padding: 42px 28px;
      border-radius: 30px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.08);
      text-align: center;
      border: 1px solid #ffe3ec;
    }

    .badge {
      display: inline-block;
      background: #ffe3ec;
      color: #ff4d88;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 30px;
      line-height: 1.3;
      margin: 0 0 10px;
      color: #111;
      word-break: keep-all;
    }

    .sub {
      color: #666;
      font-size: 15px;
      line-height: 1.7;
      margin: 0 0 26px;
      word-break: keep-all;
    }

    .code-label {
      font-size: 14px;
      color: #777;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .code-box {
      display: flex;
      align-items: center;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #ffd3e2;
      margin-bottom: 18px;
      background: #fffafb;
    }

    input {
      border: none;
      padding: 16px 14px;
      flex: 1;
      font-size: 15px;
      text-align: center;
      font-weight: 700;
      letter-spacing: 1px;
      background: transparent;
      color: #222;
      outline: none;
    }

    .copy {
      background: #ff5c8a;
      color: white;
      border: none;
      padding: 16px 18px;
      cursor: pointer;
      font-weight: 700;
      font-family: inherit;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .copy:hover {
      opacity: 0.92;
    }

    .copy:active {
      transform: scale(0.97);
    }

    .cta {
      display: block;
      margin-top: 10px;
      padding: 16px 18px;
      background: #111;
      color: white;
      border-radius: 24px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .cta:hover {
      background: #2c2c2c;
    }

    .cta:active {
      transform: scale(0.99);
    }

    .info {
      margin-top: 22px;
      background: #fff7fa;

    }

    .note {
      font-size: 12px;
      margin-top: 16px;
      color: #999;
      line-height: 1.6;
      word-break: keep-all;
    }

<body>
  <div class="wrap">
    <div class="card">
      <div class="badge">Shop Cider Invite</div>
      <h1>샵사이다 초대코드</h1>
      <p class="sub">샵사이다(CIDER) 가입 시 아래 추천인 코드를 복사해서 입력해 보세요. 간편하게 코드 복사가 가능합니다.</p>

      <div class="code-label">추천인 초대코드</div>
      <div class="code-box">
        <input type="text" value="IKZFBD1Z4TPRC" id="code" readonly>
        <button class="copy" onclick="copyCode()">복사</button>
      </div>

      <a href="https://www.shopcider.com/" target="_blank" rel="noopener noreferrer" class="cta">샵사이다 바로가기</a>

      <div class="info">
        <h2>샵사이다 CIDER 코드 안내</h2>
        <p>초대코드는 회원가입 또는 이용 과정에서 입력할 수 있습니다. 실제 혜택 적용 여부와 조건은 샵사이다 정책에 따라 달라질 수 있으니, 가입 화면에서 함께 확인해 주세요.</p>
      </div>

      <div class="note">
        본 페이지는 비공식 안내용 페이지이며, 사용자 편의를 위해 제작되었습니다.
      </div>
    </div>
  </div>

  <script>
    function copyCode() {
      const copyText = document.getElementById("code");
      copyText.select();
      copyText.setSelectionRange(0, 99999);
      document.execCommand("copy");
      alert("초대코드가 복사되었습니다!");
    }
  </script>
</body>
</html>
